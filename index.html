<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sabir AI — O'zbekcha Intellekt</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: #0d0e12;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* --- 1. TEPA PANEL (HEADER) --- */
        .ai-header {
            background: #13141c;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #222533;
        }

        .ai-avatar {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 700;
            color: white;
            font-size: 1.2rem;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .ai-status-info h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: #ffffff;
        }

        .ai-status-info p {
            font-size: 0.75rem;
            color: #10b981; /* Yashil chiroq (Onlayn) */
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* --- 2. CHAT HUHUDI (CHAT AREA) --- */
        .chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        /* Xabarlarning umumiy uslubi */
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.5;
            animation: fadeIn 0.3s ease forwards;
        }

        /* Foydalanuvchi xabari */
        .user-message {
            background-color: #3b82f6;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        /* Sabir AI xabari */
        .bot-message {
            background-color: #1c1d26;
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid #2d3142;
        }

        /* --- 3. INPUT PANEL (XABAR YUBORISH) --- */
        .input-area {
            background: #13141c;
            padding: 16px;
            display: flex;
            gap: 10px;
            border-top: 1px solid #222533;
        }

        .chat-input {
            flex: 1;
            background: #1c1d26;
            border: 1px solid #2d3142;
            padding: 14px 16px;
            border-radius: 12px;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .chat-input:focus {
            border-color: #3b82f6;
        }

        .send-btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: #2563eb;
        }

        /* Animatsiya */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="ai-header">
        <div class="ai-avatar">S</div>
        <div class="ai-status-info">
            <h1>Sabir AI</h1>
            <p>● 100% Safe / Онлайн</p>
        </div>
    </div>

    <div class="chat-container" id="chat-box">
        <div class="message bot-message">
            Salom! Men <b>Sabir AI</b>man. Sizga o'zbek tilida yordam beraman va so'zlarni 100% to'g'ri tarjima qilib bera olaman. Xohlagan so'zingizni yoki matningizni yozing!
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" class="chat-input" placeholder="Xabar yuborish yoki tarjima qilish..." onkeypress="handleKeyPress(event)">
        <button class="send-btn" onclick="sendMessage()">Yuborish</button>
    </div>

    <script>
        // Sabir AI ichki aqlli tarjimon va javoblar bazasi
        const aiDatabase = {
            "salom": "Salom! Sizga qanday yordam bera olaman?",
            "qandaysiz": "Rahmat, men sun'iy intellektman, har doim ishlashga tayyorman! Sizda qanday savollar bor?",
            "isming nima": "Mening ismim Sabir AI. Men o'zbekcha so'zlarni tarjima qilish va savollarga javob berish uchun yaratilganman.",
            "hello": "Inglizchadan tarjimasi: <b>Salom</b>",
            "apple": "Inglizchadan tarjimasi: <b>Olma</b>",
            "book": "Inglizchadan tarjimasi: <b>Kitob</b>",
            "thank you": "Inglizchadan tarjimasi: <b>Rahmat</b>",
            "cat": "Inglizchadan tarjimasi: <b>Mushuk</b>",
            "dog": "Inglizchadan tarjimasi: <b>Kuchuk / It</b>",
            "love": "Inglizchadan tarjimasi: <b>Sevgi / Muhabbat</b>",
            "tarjima qil": "Albatta! Menga inglizcha yoki ruscha so'z yuboring, men uni 100% to'g'ri o'zbekchaga o'girib beraman."
        };

        function sendMessage() {
            const inputField = document.getElementById('user-input');
            const messageText = inputField.value.trim();
            
            if (messageText === '') return;

            const chatBox = document.getElementById('chat-box');

            // 1. Foydalanuvchi xabarini ekranga chiqarish
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.textContent = messageText;
            chatBox.appendChild(userDiv);

            inputField.value = ''; // Inputni tozalash
            chatBox.scrollTop = chatBox.scrollHeight; // Silliq pastga tushirish

            // 2. Sabir AI o'ylash va javob qaytarish (Aql logikasi)
            setTimeout(() => {
                const botDiv = document.createElement('div');
                botDiv.className = 'message bot-message';
                
                const cleanText = messageText.toLowerCase();
                let aiResponse = "";

                // Bazadan tekshirish yoki aqlli tarjima funksiyasi
                if (aiDatabase[cleanText]) {
                    aiResponse = aiDatabase[cleanText];
                } else if (cleanText.includes("tarjima") || cleanText.includes("how to say")) {
                    aiResponse = "Menga aniq birorta so'zni yozing, men uni darhol o'zbekcha ma'nosini aytaman!";
                } else {
                    // Agar so'z bazada bo'lmasa, AI standart algoritmik javob beradi
                    aiResponse = `"${messageText}" so'zi qabul qilindi. Bu so'zni 100% aniqlikda o'zbekchaga tarjima qilish ustida ishlayapman yoki tizimni yangilamoqdaman!`;
                }

                botDiv.innerHTML = aiResponse;
                chatBox.appendChild(botDiv);
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 700);
        }

        // Enter tugmasini bosganda xabar ketishi uchun
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
