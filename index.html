<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Apps Store</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #0f172a;
            color: white;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        .app-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
        }
        .app-card {
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.3s;
        }
        .app-card:hover {
            transform: translateY(-10px);
        }
        .app-icon {
            width: 80px;
            height: 80px;
            background: #334155;
            border-radius: 18px;
            margin-bottom: 15px;
            object-fit: cover;
        }
        h2 { margin: 10px 0; font-size: 20px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 20px; }
        .download-btn {
            background-color: #3b82f6;
            color: white;
            text-decoration: none;
            padding: 10px 25px;
            border-radius: 8px;
            font-weight: bold;
            display: inline-block;
            transition: background 0.3s;
        }
        .download-btn:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>App Store</h1>
        <p>Лучшие игры и приложения для вашего телефона</p>
    </div>

    <div class="app-container">
        <div class="app-card">
            <img src="game_icon.png" alt="Icon" class="app-icon"> <h2>Mening O'yinim</h2>
            <p>Версия: 1.0.2 | Размер: 45 MB</p>
            <a href="oyun_nomi.apk" class="download-btn" download>Скачать APK</a>
        </div>

        </div>

</body>
</html>
