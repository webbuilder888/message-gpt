<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zeverzz AI Chat</title>
    <style>
        body { font-family: sans-serif; background: #343541; color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; }
        #chat-box { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .message { padding: 10px 15px; border-radius: 10px; max-width: 80%; }
        .user { background: #444654; align-self: flex-end; }
        .ai { background: #10a37f; align-self: flex-start; }
        .input-area { background: #40414f; padding: 20px; display: flex; gap: 10px; }
        input { flex: 1; padding: 12px; border: none; border-radius: 5px; outline: none; }
        button { background: #10a37f; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div id="chat-box">
        <div class="message ai">Assalomu alaykum! Men Zeverzz AI-man. Sizga qanday yordam bera olaman?</div>
    </div>
    <div class="input-area">
        <input type="text" id="user-input" placeholder="Savolingizni yozing...">
        <button onclick="sendMessage()">Yuborish</button>
    </div>
</body>
</html>
